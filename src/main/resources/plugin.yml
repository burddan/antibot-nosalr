name: AntibotNosalr
version: 0.1.0
main: com.nosalr.antibot.AntibotNosalr
api-version: '1.21'
description: Registra amostras do comportamento observavel dos jogadores.
author: nosalr

commands:
  amostra:
    description: Mostra uma amostra do seu estado observavel agora.
    usage: /amostra
  eventos:
    description: Lista os ultimos eventos observados de um jogador.
    usage: /eventos <jogador> [quantos]
    permission: antibot.eventos

permissions:
  antibot.eventos:
    description: Permite ver os eventos observados dos jogadores.
    default: op
